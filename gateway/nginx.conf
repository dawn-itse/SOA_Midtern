# API Gateway (nginx) - điểm vào duy nhất cho frontend: http://localhost:8000
#  - Định tuyến theo tiền tố /api/auth, /api/tuition, /api/payment tới đúng service
#  - KHÔNG công khai /internal/* và toàn bộ notification-service (chỉ gọi được trong mạng Docker)
#  - Đặt x-request-id cho mỗi request (cùng mã được ghi trong log của cả 4 service)
#  - Rate limit: đăng nhập 30 lần/phút/IP (burst 10) chống dò mật khẩu; API chung 20 req/giây/IP
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

# Nếu client đã gửi x-request-id hợp lệ thì dùng lại, ngược lại dùng mã do nginx sinh
map $http_x_request_id $gw_request_id {
  default $http_x_request_id;
  ""      $request_id;
}

server {
  listen 8000;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-Id $gw_request_id;
  proxy_read_timeout 30s;

  limit_req zone=api_zone burst=40 nodelay;
  limit_req_status 429;
  error_page 429 @rate_limited;

  location = /health {
    default_type application/json;
    return 200 '{"success":true,"service":"api-gateway"}';
  }

  location = /api/auth/login {
    limit_req zone=login_zone burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://auth-service:8001;
  }
  location /api/auth/    { proxy_pass http://auth-service:8001; }
  location /api/tuition/ { proxy_pass http://tuition-service:8002; }
  location /api/payment/ { proxy_pass http://payment-service:8003; }

  # /internal/*, /send-otp, ... và mọi đường dẫn khác: không được công khai qua gateway
  location / {
    default_type application/json;
    return 404 '{"success":false,"code":"ROUTE_NOT_FOUND","message":"Route không tồn tại trên API Gateway"}';
  }

  location @rate_limited {
    default_type application/json;
    return 429 '{"success":false,"code":"TOO_MANY_REQUESTS","message":"Quá nhiều yêu cầu, vui lòng thử lại sau"}';
  }
}
