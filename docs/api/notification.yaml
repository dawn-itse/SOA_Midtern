openapi: 3.0.3
info:
  title: Notification Service API (nội bộ)
  version: 2.0.0
  description: |
    Sinh và xác thực OTP, gửi email OTP và biên lai. **Toàn bộ API là nội bộ**: chỉ payment-service gọi,
    bắt buộc header `x-internal-secret`. Frontend không gọi trực tiếp. URI giữ nguyên (không có tiền tố `/api`).
    OTP: 6 chữ số (CSPRNG), hạn 5 phút, dùng một lần, gắn với `transaction_id`.
servers:
  - url: http://localhost:8004
security:
  - internalSecret: []
paths:
  /send-otp:
    post:
      summary: Sinh và gửi OTP (gửi lại thì OTP cũ chuyển EXPIRED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, email, amount]
              properties:
                transaction_id: { type: string }
                email: { type: string, format: email }
                amount: { type: number }
      responses:
        '200':
          description: Đã gửi OTP
          content:
            application/json:
              example: { success: true, data: { transaction_id: TXN-1731390000000-AB12CD34, expires_in: 300 } }
        '400': { description: "`INVALID_REQUEST`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/InvalidInternalSecret' }
        '502': { description: "`EMAIL_SEND_FAILED`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: "`OTP_BUSY` - không lấy được khóa `GET_LOCK` trong 5 giây", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /verify-otp:
    post:
      summary: Xác thực OTP (dùng một lần)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, otp_code]
              properties:
                transaction_id: { type: string }
                otp_code: { type: string, pattern: '^\d{6}$' }
      responses:
        '200':
          description: OTP đúng. Các OTP `PENDING` còn lại của giao dịch chuyển `EXPIRED`
          content:
            application/json:
              example: { success: true, data: { transaction_id: TXN-1731390000000-AB12CD34 } }
        '400': { description: "`INVALID_REQUEST`, `OTP_EXPIRED`, `OTP_MISMATCH`, `OTP_ALREADY_USED`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/InvalidInternalSecret' }
        '404': { description: "`OTP_NOT_FOUND`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /cancel-otp:
    post:
      summary: Vô hiệu hóa OTP đang chờ của giao dịch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id]
              properties:
                transaction_id: { type: string }
      responses:
        '200':
          description: Đã vô hiệu hóa
          content:
            application/json:
              example: { success: true, data: { transaction_id: TXN-1731390000000-AB12CD34, cancelled: 1 } }
        '400': { description: "`INVALID_REQUEST`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/InvalidInternalSecret' }
  /send-receipt:
    post:
      summary: Gửi email biên lai sau khi thanh toán thành công
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, transaction_id, full_name, student_id, student_name, amount]
              properties:
                email: { type: string, format: email }
                transaction_id: { type: string }
                full_name: { type: string }
                student_id: { type: string }
                student_name: { type: string }
                amount: { type: number }
      responses:
        '200':
          description: Đã gửi (hoặc ghi ra terminal nếu ở chế độ simulator)
          content:
            application/json:
              example: { success: true, data: { transaction_id: TXN-1731390000000-AB12CD34, mode: smtp } }
        '400': { description: "`INVALID_REQUEST`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/InvalidInternalSecret' }
        '502': { description: "`EMAIL_SEND_FAILED`", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /health:
    get:
      summary: Healthcheck (công khai)
      security: []
      responses:
        '200':
          description: Service đang chạy
          content:
            application/json:
              example: { success: true, service: notification-service, smtp: true, mailMode: smtp, mailOverride: false }
components:
  securitySchemes:
    internalSecret:
      type: apiKey
      in: header
      name: x-internal-secret
      description: Bí mật dùng chung giữa các service (`INTERNAL_API_SECRET`). Mặc định đồ án `soa_internal_secret`.
  responses:
    InvalidInternalSecret:
      description: "Thiếu/sai header `x-internal-secret`. Mã lỗi `INVALID_INTERNAL_SECRET`"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { success: false, code: INVALID_INTERNAL_SECRET, message: Thiếu hoặc sai x-internal-secret }
  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        code: { type: string }
        message: { type: string }
